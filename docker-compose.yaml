version: '3.8'

services:
  postgres:
    container_name: home_admin_postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - '5430:5432'
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    env_file:
      - .env

volumes:
  postgres:
